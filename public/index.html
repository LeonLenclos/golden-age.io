<!DOCTYPE html>
<html>
<head>
  <title>Golden Age</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/svg.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/small.css">
  <link rel="stylesheet" href="css/portrait.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/lib/howler.js"></script>
  <script src="js/lib/vector.js"></script>
  <script src="js/lib/cookies.js"></script>
  <!--
  <script src="js/lib/vue.js"></script>
  -->
  <script type="importmap">
  {
    "imports": {
      "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
      "socket": "./js/socket.js",
      "components": "./js/components.js",
      "svg-components": "./js/svg-components.js",
      "map-components": "./js/map-components.js",
      "app": "./js/app.js"
    }
  }
  </script>

  <script type="module" src="js/main.js"></script>
  
</head>
<body id="app-container" >
  <main id="app" ref="main">

    <!-- <start
      v-if="!started"
      @start="start()"
    ></start> -->
    <join-room
      v-if="!room && !joining"
      :invitation_id="target_id"
      @join_room="join_room"
      @join_private_room="join_room"
    ></join-room>

    <loading
      v-if="joining"
      :progress="loading"
    ></loading>

    <header v-if=room>
    </header>

    <waiting
    v-if="room?.playing=='not started'"
      @bot="bot"
      :room="room"
    ></waiting>

    <end
    v-else-if="room?.playing=='ended'"
    :status="who_is(player_id).victory.status"
    :reason="who_is(player_id).victory.reason"
    :rematch_propositions="room.rematch_propositions"
    @rematch="rematch"
    @quit="quit_room"
    ></end>

    <main v-if=room>
      <aside>
        <room :room=room @quit_room=quit_room ></room>

        <div v-if="room.playing=='playing'" class="panel" id="selection">
          <div class="selection-actions">
            <button @click="unselect()" :disabled="selection==undefined">
              unselect <span class="shortcut">space</span>
            </button>
            <button @click="select_next()">
              select next<span class="shortcut">,</span>
            </button>
          </div>
          <selection
            :selection="what_are(selection)"
          ></selection>
          
          <creations
            :selected_types=selected_types
            :gold=10
            @creation=creation
          ></creations>
          
          
          
                      

        </div>

        <div v-else class="panel"></div>

          
        <messages
          ref="messages"
          :messages="messages"
          @send_message="send_message"
        ></messages>

      </aside>

      <main-map
        ref=map
        :players="room?.players"
        :world="room?.world"
        :fog_of_war="room?.fog_of_war"
        :turn="room?.turn"
        :entities="filter_visible(room?.world.entities)"
        :allies="room?.world.entities.filter(e=>e.owner==player_id)"
        :events="filter_visible(room?.world.events)"
        :selection=selection
        :inspected_pos="inspected_pos"
        :cell_size="cell_size"
        @inspect=inspect
        @select=select
        @select_add=select_add
        @select_zone=select_zone
        @target=target
      ></main-map>


    </main>

  </main>
</body>
</html>
